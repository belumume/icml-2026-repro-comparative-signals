  <figcaption style="font-size:0.85em;color:#57606a;margin-top:.5em">
    <strong>Fitted against oracle variance reduction.</strong> The oracle curve substitutes the true m rather than estimating it. Above roughly sigma&nbsp;=&nbsp;0.2 that substitution helps; below it the oracle inverts catastrophically, reaching -26.73 at sigma&nbsp;=&nbsp;0.08 where the fitted estimator sits at -0.33. The y axis is symmetric log, linear within plus or minus 1 and logarithmic beyond, so the collapse is visible without compressing the rest. Merged from <code>work/analysis/vr_lowsigma.json</code> and <code>work/analysis/vr_sweep_results.json</code> (<code>vr_empirical[0]</code>, <code>vr_oracle[0]</code>), the R&nbsp;=&nbsp;250 run taking precedence.
