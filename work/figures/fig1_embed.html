  <figcaption style="font-size:0.85em;color:#57606a;margin-top:.5em">
    <strong>Empirical variance reduction against sigma, with 95 percent confidence intervals.</strong> Points are the measured reduction relative to the naive mean at the first sigma of each configuration; bars are the reported 95 percent interval. Zero is the naive mean, so anything below the rule is an estimator that costs variance rather than saving it. At sigma&nbsp;=&nbsp;0.08 the whole interval lies below zero (-0.3300, CI -0.4952 to -0.1845). The dashed line is the exact efficiency bound (with V). Merged from <code>work/analysis/vr_lowsigma.json</code> (R&nbsp;=&nbsp;250) and <code>work/analysis/vr_sweep_results.json</code> (R&nbsp;=&nbsp;40), the R&nbsp;=&nbsp;250 run taking precedence where both cover a sigma; bound from <code>work/analysis/exact_efficiency_bound.json</code> (<code>with_V.VR</code>).
  </figcaption>
